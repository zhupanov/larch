[workspace]
members = [
    "crates/larch-adapters",
    "crates/larch-cli",
    "crates/larch-core",
    "crates/larch-harness-mark",
    "crates/larch-lint",
    "crates/larch-test-support",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/character-ai/larch"
rust-version = "1.94.1"
version = "57.0.21"

[workspace.dependencies]
assert_cmd = { version = "2.2.2", default-features = false }
automod = { version = "1.0.17", default-features = false }
aws-config = { version = "=1.10.1", default-features = false, features = ["default-https-client", "rt-tokio", "sso"] }
aws-runtime = { version = "=1.9.1", default-features = false }
aws-sdk-s3 = { version = "=1.140.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-runtime-api = { version = "=1.14.0", default-features = false, features = ["client", "http-1x"] }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
csv = { version = "1.4.0", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
clap = { version = "4.6.2", default-features = false, features = ["derive", "help", "std", "usage"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
globset = { version = "0.4.19", default-features = false }
gix = { version = "=0.85.0", default-features = false, features = ["revision", "sha1", "sha256", "status"] }
google-cloud-auth = { version = "=1.14.0", default-features = false, features = ["default-rustls-provider"] }
google-cloud-gax = "=1.12.0"
google-cloud-storage = { version = "=1.16.0", default-features = false, features = ["default-rustls-provider"] }
http = { version = "1.4.2", default-features = false, features = ["std"] }
http-body = { version = "1.0.1", default-features = false }
http-body-util = { version = "0.1.4", default-features = false }
indexmap = { version = "2.14.0", default-features = false, features = ["serde", "std"] }
inventory = { version = "0.3.24", default-features = false }
libproc = { version = "=0.14.11", default-features = false }
larch-adapters = { version = "=57.0.21", path = "crates/larch-adapters" }
larch-core = { version = "=57.0.21", path = "crates/larch-core" }
larch-harness-mark = { version = "=57.0.21", path = "crates/larch-harness-mark" }
larch-lint = { version = "=57.0.21", path = "crates/larch-lint" }
larch-test-support = { version = "=57.0.21", path = "crates/larch-test-support" }
nix = { version = "0.31.3", default-features = false, features = ["process", "signal", "fs", "dir"] }
num-bigint = { version = "0.4.6", default-features = false, features = ["std"] }
octocrab = { version = "=0.54.0", default-features = false, features = ["default-client", "jwt-aws-lc-rs", "rustls", "rustls-aws-lc-rs", "timeout"] }
predicates = { version = "3.1.4", default-features = false }
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
proc-macro2 = { version = "1.0.106", default-features = false, features = ["span-locations"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
sigstore-trust-root = { version = "=0.11.0", default-features = false }
sigstore-types = { version = "=0.11.0", default-features = false }
sigstore-verify = { version = "=0.11.0", default-features = false }
snap = { version = "=1.1.2", default-features = false }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = { version = "3.27.0", default-features = false }
tiktoken-rs = { version = "0.12.0", default-features = false }
tar = { version = "0.4.44", default-features = false }
tokio = { version = "1.53.0", default-features = false, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde", "std"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tree-sitter = { version = "0.26.7", default-features = false, features = ["std"] }
tree-sitter-bash = { version = "0.25.1", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false }
unicase = { version = "2.9.0", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }
wait-timeout = { version = "0.2.1", default-features = false }
x509-cert = { version = "=0.2.5", default-features = false }
zip = { version = "=7.2.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
